name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 4 days at 12:00 UTC to prevent free tier inactivity pausing
    - cron: '0 12 */4 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Supabase Activity Ping
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive signal to Supabase
        run: |
          set -euo pipefail
          SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://furkfhzvvgxlyxukqomm.supabase.co' }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_EhOKOAExG8w5rcZIYhaCdw_JcI3Y00f' }}"
          echo "Sending keep-alive signal to Supabase..."
          response_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/track_analysis?select=video_id&limit=1")
          echo "Supabase response code: $response_code"
          if [[ "$response_code" -ge 200 && "$response_code" -lt 400 ]]; then
            echo "Supabase keep-alive signal successful. Project active."
          else
            echo "Keep-alive ping returned unexpected status: $response_code" >&2
            exit 1
          fi
